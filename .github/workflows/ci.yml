name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,omics]'
      - run: ruff check .
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[release]'
      - run: cffconvert --validate
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/omicsrepro-wheel-smoke
      - run: /tmp/omicsrepro-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/omicsrepro-wheel-smoke/bin/omicsrepro version
      - run: /tmp/omicsrepro-wheel-smoke/bin/omicsrepro doctor
