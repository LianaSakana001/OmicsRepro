[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "omicsrepro"
version = "0.2.0"
description = "Local-first reproducibility checks for omics research"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "OmicsRepro contributors" },
]
keywords = [
  "bioinformatics",
  "reproducibility",
  "single-cell",
  "h5ad",
  "anndata",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "h5py>=3.10,<4",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
omics = [
  "anndata>=0.10,<0.13",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
release = [
  "build>=1.2,<2",
  "cffconvert==2.0.0",
  "twine>=7,<8",
]

[project.urls]
Homepage = "https://github.com/LianaSakana001/OmicsRepro"
Source = "https://github.com/LianaSakana001/OmicsRepro"
Issues = "https://github.com/LianaSakana001/OmicsRepro/issues"
Changelog = "https://github.com/LianaSakana001/OmicsRepro/blob/main/CHANGELOG.md"

[project.scripts]
omicsrepro = "omicsrepro.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omicsrepro"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: opt-in tests against an external read-only dataset root",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
